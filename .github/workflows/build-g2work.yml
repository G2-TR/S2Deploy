name: Build and Deploy G2Work

run-name: ${{ inputs.deployment_id && format('deploy-{0}', inputs.deployment_id) || format('{0} · {1}', github.workflow, github.actor) }}

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Optional Feishu deployment identifier. Leave empty for manual runs.
        type: string
      repository_url:
        description: Git clone URL. Leave empty to use secret G2CHIS_REPO.
        required: false
        type: string
      source_branch:
        description: Git branch to clone.
        required: false
        default: prod-merge
        type: string
      binary_name:
        description: Binary filename override. Leave empty to use G2Work.
        required: false
        type: string
      deploy_path:
        description: Absolute deployment path override. Leave empty to use the default G2Work path.
        required: false
        type: string
      backup_dir:
        description: Absolute backup directory override. Leave empty to use the default G2Work backup directory.
        required: false
        type: string
      supervisor_target:
        description: supervisorctl target override. Leave empty to use WORK:.
        required: false
        type: string
      build_path:
        description: Go package path to build.
        required: false
        default: .
        type: string
      goos:
        description: Target GOOS.
        required: false
        default: linux
        type: string
      goarch:
        description: Target GOARCH.
        required: false
        default: amd64
        type: string
      cgo_enabled:
        description: CGO_ENABLED value used for the build.
        required: false
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-build-g2work
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/deploy-g2.yml
    secrets: inherit
    with:
      default_binary: G2Work
      default_supervisor: "WORK:"
      repository_url: ${{ inputs.repository_url }}
      source_branch: ${{ inputs.source_branch }}
      binary_name: ${{ inputs.binary_name }}
      deploy_path: ${{ inputs.deploy_path }}
      backup_dir: ${{ inputs.backup_dir }}
      supervisor_target: ${{ inputs.supervisor_target }}
      build_path: ${{ inputs.build_path }}
      goos: ${{ inputs.goos }}
      goarch: ${{ inputs.goarch }}
      cgo_enabled: ${{ inputs.cgo_enabled }}

name: Build and Package to Work Server

run-name: ${{ inputs.deployment_id && format('deploy-{0}', inputs.deployment_id) || format('{0} · {1}', github.workflow, github.actor) }}

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Optional Feishu deployment identifier. Leave empty for manual runs.
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: deploy-build-work
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/deploy-work-frontend.yml
    with:
      demo: false
    secrets:
      MAIN_SERVER_REPO: ${{ secrets.MAIN_SERVER_REPO }}
      MAIN_SERVER_HOST: ${{ secrets.WORK_SERVER_HOST }}
      MAIN_SERVER_PORT: ${{ secrets.WORK_SERVER_PORT }}
      SSH_PASSWORD: ${{ secrets.WORK_SSH_PASSWORD }}

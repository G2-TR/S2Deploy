name: Publish deploy service image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-deploy-service
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image tags
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo 'tags<<TAGS'
            echo "$image:latest"
            echo "$image:sha-$GITHUB_SHA"
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              echo "$image:$GITHUB_REF_NAME"
            fi
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: service
          platforms: linux/arm64
          provenance: mode=min
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify published ARM64 image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools inspect --raw "$image:sha-$GITHUB_SHA" > "$RUNNER_TEMP/revision.json"
          docker buildx imagetools inspect --raw "$image:latest" > "$RUNNER_TEMP/latest.json"
          cmp "$RUNNER_TEMP/revision.json" "$RUNNER_TEMP/latest.json"
          jq -e '[.manifests[] | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
            | (.platform.os + "/" + .platform.architecture)] == ["linux/arm64"]' "$RUNNER_TEMP/latest.json"
